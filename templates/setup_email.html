{% extends 'base.html' %}
{% block title %}Add Email | Betship{% endblock %}
{% block content %}
<div style="display: grid; place-items: center; min-height: calc(100vh - 140px);">
    <section class="card" style="width: min(520px, 100%);">
        <span class="pill">Account verification</span>
        <h2>Add your email address</h2>
        <p class="muted">
            This account was created before email verification was added.
            Add an email address and we will send you a verification link.
        </p>
        <form class="form-grid" method="post">
            <label>
                Email address
                <input type="email" name="email" autocomplete="email" required>
            </label>
            <div class="actions">
                <input class="button button-primary" type="submit" value="Send verification email">
                <a class="button button-ghost" href="{{ url_for('login') }}">Back to login</a>
            </div>
        </form>
    </section>
</div>
{% endblock %}
