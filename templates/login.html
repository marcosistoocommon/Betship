{% extends 'base.html' %}
{% block title %}Login | Betship{% endblock %}
{% block content %}
<div style="display: grid; place-items: center; min-height: calc(100vh - 140px);">
    <section class="card" style="width: min(520px, 100%);">
        <h2>Log in to Betship</h2>
        <p class="muted">Enter your username and password to continue.</p>
        <form class="form-grid" method="post">
            <label>
                Username
                <input type="text" name="username" autocomplete="username" required>
            </label>
            <label>
                Password
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <div class="actions">
                <input class="button button-primary" type="submit" value="Login">
            </div>
        </form>
        <p class="fine" style="margin-top: 18px;">
            Need an account?
            <a href="{{ url_for('register') }}" style="color: var(--accent);">Create one</a>
        </p>
        <p class="fine">
            Didn't receive your verification email?
            <a href="{{ url_for('resend_verification') }}" style="color: var(--accent);">Resend it</a>
        </p>
    </section>
</div>
{% endblock %}
