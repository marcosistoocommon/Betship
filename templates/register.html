{% extends 'base.html' %}
{% block title %}Register | Betship{% endblock %}
{% block content %}
<div style="display: grid; place-items: center; min-height: calc(100vh - 140px);">
    <section class="card" style="width: min(520px, 100%);">
        <h2>Create your Betship account</h2>
        <p class="muted">You will receive a verification link before you can use the platform.</p>
        <form class="form-grid" method="post">
            <label>
                Username
                <input type="text" name="username" autocomplete="username" required>
            </label>
            <label>
                Email address
                <input type="email" name="email" autocomplete="email" required>
            </label>
            <label>
                Password
                <input type="password" name="password" autocomplete="new-password" required>
            </label>
            <div class="actions">
                <input class="button button-primary" type="submit" value="Create account">
                <a class="button button-ghost" href="{{ url_for('login') }}">Back to login</a>
            </div>
        </form>
    </section>
</div>
{% endblock %}
